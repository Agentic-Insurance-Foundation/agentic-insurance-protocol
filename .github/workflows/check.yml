name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: schema.json, tools.json, examples, the files of the registry and the generated docs are up to date
        run: git diff --exit-code -- spec/schema.json spec/tools.json spec/examples registry/src/generated registry/public docs/0.1/reference.mdx docs/0.1/skill.mdx docs/0.1/skill docs/snippets docs/favicon.svg
      - run: bun run build
